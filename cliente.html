<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo SD COMAYAGUA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800;900&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />

<body class="client-page">
  <main class="client-wrap">
    <section class="client-hero-public">

        <span class="eyebrow">Catálogo oficial</span>

    <div class="search-card"><input id="clientSearch" type="search" placeholder="Buscar producto..." /></div>
    <div id="clientStatus" class="private-note">Cargando catálogo...</div>

  <script src="js/cliente.js"></script>
