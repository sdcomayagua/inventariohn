<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="admin-panel">
        <div class="productos-header">
            <div class="productos-titulo">
                <h2>Productos</h2>
            </div>
            <div class="productos-botones">
                <button class="btn producto-btn">+ Producto</button>
                <button class="btn sheets-btn">Sheets</button>
                <span class="resultados">40 resultados</span>
            </div>
        </div>

        <div class="productos-lista">
            <div class="producto-card">
                <img src="https://via.placeholder.com/150" alt="Producto">
                <div class="producto-info">
                    <h3>Producto 1</h3>
                    <p>Descripción del producto</p>
                </div>
            </div>
            <div class="producto-card">
                <img src="https://via.placeholder.com/150" alt="Producto">
                <div class="producto-info">
                    <h3>Producto 2</h3>
                    <p>Descripción del producto</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
