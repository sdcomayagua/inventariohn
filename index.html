<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inventario y productos disponibles. Compra y consulta nuestro stock actualizado.">
  <title>Inventario HN</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Manifest (para PWA si aplica) -->
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <header>
    <div class="logo">
      <img src="assets/logo-sdc.png" alt="Logo Inventario HN">
      <h1>Inventario HN</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#productos">Productos</a></li>
        <li><a href="#categorias">Categorías</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="categorias" class="categorias">
      <h2>Categorías</h2>
      <div class="grid-categorias" id="categorias-list">
        <!-- Categorías se generan con JS -->
      </div>
    </section>

    <section id="productos" class="productos">
      <h2>Productos</h2>
      <div class="grid-productos" id="productos-list">
        <!-- Productos se generan con JS -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Inventario HN. Todos los derechos reservados.</p>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
