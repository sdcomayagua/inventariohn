<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SDCOMAYAGUA | Acceso</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Acceso al panel de inventario y ventas de SDCOMAYAGUA.">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=31-pro-mobile">
  <link rel="stylesheet" href="style-pro-v31.css?v=31-pro-mobile">

</head>
<body class="theme-light login-page v38-mobile-pro">
  <main class="login-shell">
    <section class="login-panel glass-panel premium-login-panel">
      <div class="login-badge">SDCOMAYAGUA</div>
      <div class="brand-copy">
        <p class="eyebrow">Panel seguro</p>
        <h1>SDCOMAYAGUA</h1>
        <p class="support-copy">Control de inventario, ventas, depósitos y comprobantes desde el celular.</p>
      </div>

      <div class="field-group">
        <label for="inv-user">Usuario</label>
        <input id="inv-user" type="text" autocomplete="username" placeholder="Usuario">
      </div>

      <div class="field-group">
        <label for="inv-pass">Contraseña</label>
        <input id="inv-pass" type="password" autocomplete="current-password" placeholder="Contraseña">
      </div>


      <button class="btn-primary premium-login-btn" onclick="invLogin()">Ingresar al panel</button>

      <div class="login-footer-row">
        <div class="login-footnote">Inventario · ventas · comprobantes</div>
        <button class="btn-ghost login-theme-btn" type="button" id="theme-toggle" onclick="toggleTheme()">◐</button>
      </div>
    </section>
  </main>

  <script src="app.js?v=31-pro-mobile"></script>
  <script src="fix-v31.js?v=31-pro-mobile"></script>
  <script src="fix-v33-maravilla.js?v=33-maravilla"></script>
  <script src="fix-v38-mobile-pro.js?v=38-mobile-pro"></script>
