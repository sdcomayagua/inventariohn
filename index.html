<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SDCOMAYAGUA | Acceso Privado</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Acceso privado al panel de inventario, ventas y comprobantes de SDCOMAYAGUA.">
  <meta name="theme-color" content="#f7fbff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="style-v45-final.css?v=45-admin-pro-limpio">
</head>
<body class="theme-light login-page v45-admin-login">
  <main class="login-shell">
    <section class="login-panel glass-panel premium-login-panel admin-login-card" aria-label="Acceso privado SDCOMAYAGUA">
      <div class="login-top-line">
        <div class="login-logo-mark">SD</div>
        <div>
          <div class="login-badge">Acceso privado</div>
          <p class="eyebrow">Panel seguro</p>
        </div>
      </div>

      <div class="brand-copy">
        <h1>SDCOMAYAGUA</h1>
        <p class="support-copy">Control privado de inventario, ventas, envíos y comprobantes desde celular o tablet.</p>
      </div>

      <div class="login-status-pills" aria-hidden="true">
        <span>Inventario</span>
        <span>Ventas</span>
        <span>Comprobantes</span>
      </div>

      <div class="field-group">
        <label for="inv-user">Usuario</label>
        <input id="inv-user" type="text" autocomplete="username" placeholder="Escribe tu usuario">
      </div>

      <div class="field-group">
        <label for="inv-pass">Contraseña</label>
        <input id="inv-pass" type="password" autocomplete="current-password" placeholder="Escribe tu contraseña">
      </div>

      <button class="btn-primary premium-login-btn" type="button" onclick="invLogin()">Ingresar al panel privado</button>

      <div class="login-footer-row">
        <div class="login-footnote">Sistema privado · SD Comayagua</div>
        <button class="btn-ghost login-theme-btn" type="button" id="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">◐</button>
      </div>
    </section>
  </main>

  <script src="app-v45-final.js?v=45-admin-pro-limpio"></script>
</body>
</html>
