<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061322">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SDC Caja">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest?v=7-pro-estable">
  <title>SD Comayagua · V7 PRO Estable</title>
  <link rel="icon" href="assets/logo-sdc-2026.png?v=7-pro-estable">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=7-pro-estable">
  <link rel="stylesheet" href="css/sdc-mobile-pro.css?v=7-pro-estable">
  <link rel="stylesheet" href="css/sdc-v3-app.css?v=7-pro-estable">
  <link rel="stylesheet" href="css/sdc-v7-pro-estable-fixes.css?v=7-pro-pulido">
</head>
<body>
  <div id="app">
    <section class="boot-loading" data-sdc-loading="1">
      <div class="boot-loading-card">
        <img src="assets/logo-sdc-2026.png" alt="SD Comayagua">
        <h1>Cargando SDC...</h1>
        <p>Preparando inventario, ventas, cotizaciones y caja.</p>
      </div>
    </section>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <button id="goTop" class="go-top" aria-label="Subir">↑</button>

  <!-- Primero cargan los archivos locales críticos. Así el panel no depende de CDN para iniciar. -->
  <script defer src="js/sdc-error-guard.js?v=7-pro-estable"></script>
  <script defer src="js/data.js?v=7-pro-estable"></script>
  <script defer src="js/storage.js?v=7-pro-estable"></script>
  <script defer src="js/app.js?v=7-pro-estable"></script>
  <script defer src="js/sdc-mobile-pro.js?v=7-pro-estable"></script>
  <script defer src="js/sdc-v3-app.js?v=7-pro-estable"></script>
  <script defer src="js/sdc-boot-check.js?v=7-pro-estable"></script>

  <!-- Librerías no críticas: se cargan después. Si fallan, el inventario igual abre. -->
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</body>
</html>
